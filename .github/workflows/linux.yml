name: Linux server container

on:
  push:
    branches:
      - linux-p31
      - 'perpetuum-ai/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build native server image
        run: docker build --tag perpetuum-server:linux-ci .

      - name: Run server unit tests
        run: docker build --target test --tag perpetuum-server:test-ci .

      - name: Probe console entry point
        run: docker run --rm perpetuum-server:linux-ci --help
